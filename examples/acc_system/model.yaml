# System model of ACC (pattern can_system): ASIL D by decomposition into two can_function nodes.
schema_version: 1
pattern: can_system

component:
  name: AccSystem
  namespace: adas::acc_system
  asil: D
  profile: asil

inputs:
  requirements: requirements.yaml
  features: [features/safety_goals.feature, features/availability.feature]
  hara: safety/hara.yaml
  fta: safety/fta.yaml

nodes:
  controller: acc
  monitor: acc_monitor

# Actuator ECU (powertrain / brake), assumption of use: reacts within 100 ms of the monitor's
# verdict (bus transfer + arbitration + start of the ramp-out).
actuator:
  reaction_ms: 100
  ramp_out_mps3: 20
  satisfies: [REQ-ACCS-005]

allocation:
  satisfies: [REQ-ACCS-006]

# ASIL and FTTI come from safety/hara.yaml (GEN-067, GEN-069): each FTTI here equals the smallest
# FTTI derived from the goal's hazardous events; the fault trees are in safety/fta.yaml (GEN-068).
safety_goals:
  - {requirement: REQ-ACCS-001, ftti_ms: 2200, mechanisms: [request_limit, request_rate]}
  - {requirement: REQ-ACCS-002, ftti_ms: 490, mechanisms: [request_limit, request_rate]}
  - {requirement: REQ-ACCS-003, ftti_ms: 370, mechanisms: [unintended_accel, accel_and_brake]}
  - {requirement: REQ-ACCS-004, ftti_ms: 380, mechanisms: [command_timeout, request_outside_active]}
  - {requirement: REQ-ACCS-007, ftti_ms: 590, mechanisms: [command_timeout]}
