# Adaptive Cruise Control (ACC), longitudinal only, 30..180 km/h (not stop-and-go).
# Derived from common ACC practice (ISO 15622 style); values are project choices, NOT normative.
# ASIL D safety goals are decomposed (ISO 26262-9): controller B(D) + independent monitor B(D).
# Safety goals, FTTI and the monitor live in examples/*_system and examples/*_monitor.
schema_version: 1
component: AccController
requirements:
  # --- Modes and driver interaction ---------------------------------------------------------
  - id: REQ-ACC-001
    asil: QM
    ears: event
    text: >-
      When the driver switches the ACC main switch on, the AccController shall enter STANDBY.
    verification: [sil]
  - id: REQ-ACC-002
    asil: B(D)
    ears: event
    text: >-
      When the driver presses Set in STANDBY with the brake pedal released and an ego speed of at
      least 30 km/h, the AccController shall enter ACTIVE with the set speed equal to the current
      ego speed rounded to the nearest km/h.
    verification: [sil]
  - id: REQ-ACC-003
    asil: B(D)
    ears: unwanted
    text: >-
      If the driver presses Set or Resume at an ego speed below 30 km/h, then the AccController
      shall remain in STANDBY.
    verification: [sil]
  - id: REQ-ACC-004
    asil: QM
    ears: event
    text: >-
      When the driver presses Resume in STANDBY with a stored set speed, the brake pedal released
      and an ego speed of at least 30 km/h, the AccController shall enter ACTIVE with the stored
      set speed.
    verification: [sil]
  - id: REQ-ACC-005
    asil: QM
    ears: event
    text: >-
      When the driver presses Speed Up or Speed Down in ACTIVE or OVERRIDE, the AccController shall
      change the set speed by 5 km/h, limited to the range 30 km/h to 180 km/h.
    verification: [sil]
  - id: REQ-ACC-006
    asil: B(D)
    ears: event
    text: >-
      When the driver presses the brake pedal or Cancel in ACTIVE or OVERRIDE, the AccController
      shall enter STANDBY within one cycle and keep the set speed stored.
    verification: [sil]
  - id: REQ-ACC-007
    asil: B(D)
    ears: event
    text: >-
      When the driver presses the accelerator pedal beyond 5 % in ACTIVE, the AccController shall
      enter OVERRIDE and request neither acceleration nor braking until the pedal is released.
    verification: [sil]
  - id: REQ-ACC-008
    asil: QM
    ears: event
    text: >-
      When the driver switches the ACC main switch off, the AccController shall enter OFF and
      clear the set speed.
    verification: [sil]
  - id: REQ-ACC-009
    asil: B(D)
    ears: unwanted
    text: >-
      If the ego speed falls below 25 km/h in ACTIVE, then the AccController shall enter STANDBY.
    verification: [sil]
  # --- Longitudinal control -------------------------------------------------------------------
  - id: REQ-ACC-010
    asil: QM
    ears: state
    text: >-
      While ACTIVE without a relevant target, the AccController shall control the ego speed to the
      set speed with a steady-state error of at most 1 km/h.
    verification: [sil]
  - id: REQ-ACC-011
    asil: B(D)
    ears: state
    text: >-
      While ACTIVE with a relevant target, the AccController shall control the distance to the
      target to 5 m plus the selected time gap multiplied by the ego speed, with a steady-state
      error of at most 2 m, and shall not exceed the set speed.
    verification: [sil]
  - id: REQ-ACC-012
    asil: QM
    ears: ubiquitous
    text: >-
      The AccController shall offer the time gap settings 1, 2 and 3 corresponding to 1.0 s, 1.5 s
      and 2.0 s.
    verification: [sil]
  - id: REQ-ACC-013
    asil: B(D)
    ears: ubiquitous
    text: >-
      The AccController shall treat a radar object as the relevant target only if it is valid,
      at most 200 m ahead and at most 1.8 m from the ego lane centre.
    verification: [sil]
  - id: REQ-ACC-014
    asil: B(D)
    ears: ubiquitous
    text: >-
      The AccController shall limit the requested acceleration to 2.0 m/s2 and the requested
      deceleration to 3.5 m/s2.
    verification: [sil]
  - id: REQ-ACC-015
    asil: QM
    ears: state
    text: >-
      While ACTIVE, the AccController shall limit the change of the requested longitudinal
      acceleration to 2.5 m/s3 when it increases and 5.0 m/s3 when it decreases.
    verification: [sil]
  - id: REQ-ACC-016
    asil: B(D)
    ears: unwanted
    text: >-
      If a relevant target that is followed at the selected time gap decelerates at up to 3 m/s2,
      or a slower vehicle cuts in at 25 m or more, then the AccController shall keep the distance
      above 5 m.
    verification: [sil]
  # --- Outputs ----------------------------------------------------------------------------------
  - id: REQ-ACC-017
    asil: B(D)
    ears: ubiquitous
    text: >-
      The AccController shall never request acceleration and braking at the same time.
    verification: [sil]
  - id: REQ-ACC-018
    asil: B(D)
    ears: ubiquitous
    text: >-
      The AccController shall always request a steering angle of 0 deg.
    verification: [sil]
  - id: REQ-ACC-019
    asil: B(D)
    ears: state
    text: >-
      While not ACTIVE, the AccController shall request neither acceleration nor braking.
    verification: [sil]
  - id: REQ-ACC-020
    asil: B(D)
    ears: ubiquitous
    text: >-
      The AccController shall send the AccCommand message every 20 ms with E2E protection and
      report its mode, set speed and time gap setting in it.
    verification: [sil]
  # --- Faults -----------------------------------------------------------------------------------
  - id: REQ-ACC-021
    asil: B(D)
    ears: unwanted
    text: >-
      If no valid RadarObject frame is received for 120 ms, or no valid EgoState or DriverInput
      frame for 60 ms, then the AccController shall enter FAULT, where frames failing the E2E
      check count as not received.
    verification: [sil]
  - id: REQ-ACC-022
    asil: B(D)
    ears: state
    text: >-
      While in FAULT, the AccController shall remain in FAULT until the driver switches the ACC
      main switch off.
    verification: [sil]
