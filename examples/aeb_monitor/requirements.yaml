# Independent safety monitor of the AEB controller. The ASIL D safety goal "no unjustified
# emergency braking" (examples/aeb_system) is decomposed per ISO 26262-9: AebController B(D) +
# AebMonitor B(D). The monitor justifies each braking request from its own evaluation of the
# radar target. Missed braking is not covered by this monitor. Values are project choices.
schema_version: 1
component: AebMonitor
requirements:
  - id: REQ-AEBM-001
    asil: B(D)
    ears: event
    text: >-
      When the first valid AebCommand frame is received, the AebMonitor shall enter MONITORING
      and check that command.
    verification: [sil]
  - id: REQ-AEBM-002
    asil: B(D)
    ears: state
    text: >-
      While in MONITORING, the AebMonitor shall grant the permit and report the E2E counter of the
      last AebCommand that passed every check as the approved counter.
    verification: [sil]
  - id: REQ-AEBM-003
    asil: B(D)
    ears: unwanted
    text: >-
      If an AebCommand requests more than 8.1 m/s2, or more than 4.1 m/s2 in PARTIAL_BRAKE, then
      the AebMonitor shall enter SAFE_STATE with reason REQUEST_LIMIT.
    verification: [sil]
  - id: REQ-AEBM-004
    asil: B(D)
    ears: unwanted
    text: >-
      If an AebCommand requests braking in a state other than PARTIAL_BRAKE or FULL_BRAKE, then the
      AebMonitor shall enter SAFE_STATE with reason REQUEST_OUTSIDE_BRAKING.
    verification: [sil]
  - id: REQ-AEBM-005
    asil: B(D)
    ears: unwanted
    text: >-
      If braking starts while no valid radar target at most 150 m ahead and at most 2.1 m from
      the lane centre approaches with a time to collision of 2.1 s or less, then the AebMonitor
      shall enter SAFE_STATE with reason UNJUSTIFIED_BRAKING.
    verification: [sil]
  - id: REQ-AEBM-006
    asil: B(D)
    ears: unwanted
    text: >-
      If a deceleration above 4.1 m/s2 is first requested while no such target approaches with a
      time to collision of 1.5 s or less, then the AebMonitor shall enter SAFE_STATE with reason
      UNJUSTIFIED_FULL_BRAKING.
    verification: [sil]
  - id: REQ-AEBM-007
    asil: B(D)
    ears: unwanted
    text: >-
      If braking continues while no valid radar target at most 150 m ahead and at most 2.1 m from
      the lane centre is present, then the AebMonitor shall enter SAFE_STATE with reason
      UNJUSTIFIED_BRAKING.
    verification: [sil]
  - id: REQ-AEBM-008
    asil: B(D)
    ears: unwanted
    text: >-
      If in MONITORING no valid AebCommand frame is received for 60 ms, then the AebMonitor shall
      enter SAFE_STATE with reason COMMAND_TIMEOUT.
    verification: [sil]
  - id: REQ-AEBM-009
    asil: B(D)
    ears: state
    text: >-
      While in SAFE_STATE, the AebMonitor shall withdraw the permit and report the reason of the
      first violation until the next power cycle.
    verification: [sil]
  - id: REQ-AEBM-010
    asil: B(D)
    ears: ubiquitous
    text: >-
      The AebMonitor shall send the AebMonitorStatus message every 20 ms with E2E protection.
    verification: [sil]
