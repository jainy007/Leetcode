# System model of AEB (pattern can_system): ASIL D by decomposition into two can_function nodes.
schema_version: 1
pattern: can_system

component:
  name: AebSystem
  namespace: adas::aeb_system
  asil: D
  profile: asil

inputs:
  requirements: requirements.yaml
  features: [features/safety_goals.feature, features/availability.feature]
  hara: safety/hara.yaml
  fta: safety/fta.yaml

nodes:
  controller: aeb
  monitor: aeb_monitor

actuator:
  reaction_ms: 100
  ramp_out_mps3: 20
  satisfies: [REQ-AEBS-003]

allocation:
  satisfies: [REQ-AEBS-004]

# ASIL and FTTI come from safety/hara.yaml (GEN-067, GEN-069); fault trees in safety/fta.yaml (GEN-068).
safety_goals:
  - {requirement: REQ-AEBS-001, ftti_ms: 780, mechanisms: [braking_justification, request_limit, request_outside_braking]}
  - {requirement: REQ-AEBS-002, ftti_ms: 780, mechanisms: [command_timeout]}
