# System model of AEB (pattern can_system): ASIL D by decomposition into two can_function nodes.
schema_version: 1
pattern: can_system

component:
  name: AebSystem
  namespace: adas::aeb_system
  asil: D
  profile: asil

inputs:
  requirements: requirements.yaml
  features: [features/safety_goals.feature, features/availability.feature]

nodes:
  controller: aeb
  monitor: aeb_monitor

actuator:
  reaction_ms: 100
  satisfies: [REQ-AEBS-003]

allocation:
  satisfies: [REQ-AEBS-004]

# FTTI values are assumptions pending the HARA (docs/safety/acc_aeb_safety_concept.md).
safety_goals:
  - {requirement: REQ-AEBS-001, ftti_ms: 200, mechanisms: [braking_justification, request_limit, request_outside_braking]}
  - {requirement: REQ-AEBS-002, ftti_ms: 200, mechanisms: [command_timeout]}
