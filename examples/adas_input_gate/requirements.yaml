schema_version: 1
component: AdasInputGate
requirements:
  - id: REQ-GATE-001
    asil: B
    ears: event
    text: >-
      When a received ObjectSummary frame passes the E2E check and the plausibility check while
      the gate is in INIT, the AdasInputGate shall enter RUN in the same cycle.
    verification: [sil]
  - id: REQ-GATE-002
    asil: B
    ears: state
    text: >-
      While the gate is in RUN, the AdasInputGate shall output the decoded ObjectSummary signals
      with qualifier VALID for every cycle in which a valid frame was received.
    verification: [sil]
  - id: REQ-GATE-003
    asil: B
    ears: unwanted
    text: >-
      If 3 consecutive cycles contain frames that fail the E2E check while the gate is in RUN,
      then the AdasInputGate shall enter DEGRADED and set the output qualifier to INVALID.
    verification: [sil]
  - id: REQ-GATE-004
    asil: B
    ears: unwanted
    text: >-
      If a decoded signal lies outside its specified physical range, then the AdasInputGate shall
      not forward the value and shall enter DEGRADED.
    verification: [sil]
  - id: REQ-GATE-005
    asil: B
    ears: unwanted
    text: >-
      If no frame is received for 5 consecutive cycles (100 ms), then the AdasInputGate shall
      enter SAFE.
    verification: [sil]
  - id: REQ-GATE-006
    asil: B
    ears: event
    text: >-
      When 10 consecutive valid frames are received while the gate is in DEGRADED, the
      AdasInputGate shall return to RUN.
    verification: [sil]
  - id: REQ-GATE-007
    asil: B
    ears: state
    text: >-
      While the gate is in SAFE, the AdasInputGate shall remain in SAFE until the component is
      restarted.
    verification: [sil]
  - id: REQ-GATE-008
    asil: B
    ears: ubiquitous
    text: >-
      The AdasInputGate shall publish its state, output qualifier and nearest distance in the
      GateStatus CAN message every cycle.
    verification: [sil]
  - id: REQ-GATE-009
    asil: B
    ears: ubiquitous
    text: >-
      The AdasInputGate shall report one alive indication to health supervision per cycle.
    verification: [sil]
