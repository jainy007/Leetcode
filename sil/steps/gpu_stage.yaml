# Controlled step vocabulary for the gpu_stage pattern (qualified tool configuration).
schema_version: 1
pattern: gpu_stage
steps:
  - id: GPU-S01
    keywords: [given]
    pattern: '^an initialized stage$'
    cpp: 'ASSERT_TRUE(sil_.init().ok());'

  - id: GPU-S02
    keywords: [given]
    pattern: '^the weight file (?P<tensor>[a-z][a-z0-9_]*) is corrupted$'
    types: {tensor: 'ref:weight'}
    cpp: 'sil_.corrupt_weight_file({{ tensor }});'

  - id: GPU-S03
    keywords: [when]
    pattern: '^the stage is initialized$'
    cpp: 'const ea::Result<void> init_result = sil_.init();'

  - id: GPU-S04
    keywords: [then]
    pattern: '^initialization fails with (?P<error>[A-Za-z]+)$'
    types: {error: 'enum:[IntegrityError, IoError, LengthMismatch, InvalidArgument]'}
    cpp: 'EXPECT_EQ(init_result.error(), ea::ErrorCode::k{{ error }});'

  - id: GPU-S05
    keywords: [then]
    pattern: '^initialization succeeds$'
    cpp: 'EXPECT_TRUE(init_result.ok());'

  - id: GPU-S06
    keywords: [when]
    pattern: '^the stage processes a ramp input$'
    cpp: 'sil_.process_ramp(1);'

  - id: GPU-S07
    keywords: [when]
    pattern: '^the stage processes (?P<n>[0-9]{1,4}) ramp inputs$'
    types: {n: int}
    cpp: 'sil_.process_ramp({{ n }});'

  - id: GPU-S08
    keywords: [when]
    pattern: '^the stage processes a zero input$'
    cpp: 'sil_.process_constant(0U);'

  - id: GPU-S09
    keywords: [when]
    pattern: '^the stage processes a constant (?P<v>[0-9]{1,3}) input$'
    types: {v: int}
    cpp: 'sil_.process_constant({{ v }}U);'

  - id: GPU-S10
    keywords: [then]
    pattern: '^the output status is (?P<status>VALID|DEADLINE_MISS|IMPLAUSIBLE)$'
    types: {status: 'enum:[VALID, DEADLINE_MISS, IMPLAUSIBLE]'}
    cpp: 'EXPECT_EQ(sil_.last_output().status, OutputStatus::k{{ status | camel }});'

  - id: GPU-S11
    keywords: [then]
    pattern: '^score (?P<cls>[a-z][a-z0-9_]*) equals (?P<value>[0-9]+(?:\.[0-9]+)?) within (?P<tol>[0-9]+(?:\.[0-9]+)?)$'
    types: {cls: 'ref:class', value: number, tol: number}
    cpp: 'EXPECT_NEAR(sil_.last_output().scores[{{ cls }}], {{ value }}, {{ tol }});'

  - id: GPU-S12
    keywords: [then]
    pattern: '^no memory was allocated after initialization$'
    cpp: 'EXPECT_EQ(sil_.allocations_since_init(), 0U);'

  - id: GPU-S13
    keywords: [given]
    pattern: '^the backend takes (?P<ms>[0-9]{1,4}) ms per execution$'
    types: {ms: int}
    cpp: 'sil_.backend().set_execution_delay_ms({{ ms }});'

  - id: GPU-S14
    keywords: [given]
    pattern: '^the backend overwrites score (?P<cls>[a-z][a-z0-9_]*) with (?P<value>NaN|-?[0-9]+(?:\.[0-9]+)?)$'
    types: {cls: 'ref:class', value: number_or_nan}
    cpp: 'sil_.backend().overwrite_output({{ cls }}, {{ value }});'

  - id: GPU-S15
    keywords: [given]
    pattern: '^the channel overwrites score (?P<cls>[a-z][a-z0-9_]*) with (?P<value>NaN|-?[0-9]+(?:\.[0-9]+)?)$'
    types: {cls: 'ref:class', value: number_or_nan}
    cpp: 'sil_.corrupt_channel({{ cls }}, {{ value }});'

  - id: GPU-S16
    keywords: [when]
    pattern: '^the monitor checks the latest output$'
    cpp: 'sil_.monitor_check(0);'

  - id: GPU-S17
    keywords: [when]
    pattern: '^the monitor checks the latest output after (?P<ms>[0-9]{1,5}) ms$'
    types: {ms: int}
    cpp: 'sil_.monitor_check({{ ms }});'

  - id: GPU-S18
    keywords: [then]
    pattern: '^the monitor reports (?P<verdict>OK|NO_DATA|TIMEOUT|IMPLAUSIBLE|DEADLINE_MISS)$'
    types: {verdict: 'enum:[OK, NO_DATA, TIMEOUT, IMPLAUSIBLE, DEADLINE_MISS]'}
    cpp: 'EXPECT_EQ(sil_.last_verdict(), MonitorVerdict::k{{ verdict | camel }});'
