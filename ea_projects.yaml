# Projects processed by `python3 -m tools.gen`. Explicit list: nothing is generated implicitly.
schema_version: 1
projects:
  - {name: adas_input_gate, model: examples/adas_input_gate/model.yaml, output: generated/adas_input_gate}
  - {name: gpu_inference_stage, model: examples/gpu_inference_stage/model.yaml, output: generated/gpu_inference_stage}
  - {name: acc, model: examples/acc/model.yaml, output: generated/acc}
  - {name: aeb, model: examples/aeb/model.yaml, output: generated/aeb}
  - {name: acc_monitor, model: examples/acc_monitor/model.yaml, output: generated/acc_monitor}
  - {name: aeb_monitor, model: examples/aeb_monitor/model.yaml, output: generated/aeb_monitor}
  - {name: acc_system, model: examples/acc_system/model.yaml, output: generated/acc_system}
  - {name: aeb_system, model: examples/aeb_system/model.yaml, output: generated/aeb_system}
